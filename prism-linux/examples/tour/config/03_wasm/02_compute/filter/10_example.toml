# =============================================================================
# compute/filter/10_example.toml — heavy math on tags (commented example)
#
# A compute block runs a small WebAssembly (WASM) program in the background:
# a filter, an observer, a spectrum analyser or a soft sensor. Prism feeds it
# input tags at a fixed period and writes the result to output tags, without
# slowing the read/write cycle of the devices.
#
# This file is a ready-to-edit example, fully commented out: nothing runs until
# you remove the leading "#" and supply a .wasm file built for the prism:compute
# contract. The ML example in 03_wasm/03_ml/ follows the same pattern.
#
# Paths are relative to the config/ directory.
# =============================================================================

# [defaults]
# enabled      = true
# error_policy = "log_and_hold"   # log_and_hold | disable_block | backoff
#
# # One loaded artifact. Several blocks may share it.
# [[plugin]]
# id            = "example_filter"
# path          = "../plugins/example/compute_plugin_example.wasm"
# max_memory_mb = 64
# fuel_per_call = 500000000
#
# # One block = one calculation.
# [[block]]
# name         = "temperature_filter"
# plugin       = "example_filter"
# period_ms    = 100
# error_policy = "backoff"
#
# # Constants passed to the block.
# [block.params]
# q = 0.01
# r = 1.0
#
# # Tags read by the block, in order.
# [[block.input]]
# tag = "tour_plc.temperature"
#
# # Tags written by the block.
# [[block.output]]
# tag   = "calculations.estimated_temperature"
# scale = 1.0
#
# # A tag whose value overrides a constant at run time.
# [[block.param_tag]]
# name = "r"
# tag  = "calculations.filter_r"
