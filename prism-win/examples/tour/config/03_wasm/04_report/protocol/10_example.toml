# =============================================================================
# report/protocol/10_example.toml — generated documents (commented example)
#
# A report combines a description of the data (which tags, which columns, which
# labels) with a WASM renderer that turns it into a file: XLSX, PDF or any
# other format the plugin implements. A report starts on a rising edge of a
# "button" tag or periodically, and the core writes the file to disk.
#
# This file is a ready-to-edit example, fully commented out: nothing runs until
# you remove the leading "#" and supply a .wasm file built for the prism:report
# contract.
#
# Paths are relative to the config/ directory.
# =============================================================================

# [defaults]
# enabled = true
# poll_ms = 200     # how often the button tag is checked
#
# [[plugin]]
# id   = "xlsx"
# path = "../plugins/report/report_plugin_xlsx.wasm"
#
# [[report]]
# name         = "tour_report"
# plugin       = "xlsx"
# enabled      = true
# button_tag   = "tour_plc.pump_run"      # rising edge starts the report
# reset_button = true                     # write 0 back after generation
# output_dir   = "../data/reports"
# file_name    = "Tour_{date}_{time}.xlsx"
# title        = "Prism tour report"
# subtitle     = "Generated by the example project"
# sheet_name   = "Report"
#
# # Which measurement numbers enter the document. {n} in a tag name is replaced
# # with the number; `include` decides the range:
# #   completed = only pairs whose status tags are exactly 1
# #   count     = 1..count_tag value
# #   all       = 1..max_columns
# [report.columns]
# count       = 1
# max_columns = 5
# include     = "completed"
# status_before = "calculations.report_done_{n}"
#
# # A simple table section: one row per tag.
# [[report.section]]
# kind  = "table"
# title = "Live values"
#
# [[report.section.row]]
# label  = "Temperature, °C"
# tag    = "tour_plc.temperature"
# format = "float1"
#
# [[report.section.row]]
# label  = "Pressure, bar"
# tag    = "tour_plc.pressure"
# format = "float2"
