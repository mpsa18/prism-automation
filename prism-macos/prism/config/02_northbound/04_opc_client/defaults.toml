# =============================================================================
# 04_opc_client/defaults.toml — OPC UA clients generated by prism-devtools
#
# `prism-devtools generate opc-client` writes endpoints.toml in this folder.
# Keep this file for shared security and session defaults.
# =============================================================================

# [defaults]
# security_policy      = "None"
# security_mode        = "None"
# pki_dir              = "config/pki/client"
# trust_server_certs   = false
# max_nodes_per_read   = 100
# session_timeout_ms   = 60000
# reconnect_backoff_ms = 1000
