# Tags published by the PAMAS S40 driver.
# Values are the mean of the last measurement block (usually 3 runs).

[[device.tag]]
name = "2um"
data_type = "dword"
access = "ro"
unit = "pcs"
description = "Particles > 2.00 um (mean of the last measurement block)"

